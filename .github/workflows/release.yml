name: Release to itch.io

on:
  push:
    tags:
    - 'v*'

env:
  ITCH_USER_NAME: apos
  ITCH_GAME_NAME: lookingforgroup
  DESKTOP_PATH: Platforms/DesktopGL
  WEB_PATH: Platforms/BlazorGL.KNI

jobs:
  build:

    # Windows, because both MonoGame and KNI compile infinite.fx with the DirectX shader
    # compiler. On Linux that needs a Wine setup for MonoGame, and KNI has none.
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Get version from tag
      run: |
        TAGVERSION=$(git describe --tags --abbrev=0)
        echo "TAGVERSION=${TAGVERSION:1}" >> $GITHUB_ENV
    - name: Build Windows
      run: dotnet publish ${{ env.DESKTOP_PATH }} -r win-x64 -c Release --output artifacts/windows --self-contained -p:Version=${{ env.TAGVERSION }}
    - name: Build Osx
      run: dotnet publish ${{ env.DESKTOP_PATH }} -r osx-x64 -c Release --output artifacts/osx --self-contained -p:Version=${{ env.TAGVERSION }}
    - name: Build Linux
      run: dotnet publish ${{ env.DESKTOP_PATH }} -r linux-x64 -c Release --output artifacts/linux --self-contained -p:Version=${{ env.TAGVERSION }}
    - name: Build Web
      run: dotnet publish ${{ env.WEB_PATH }} -c Release --output artifacts/web -p:Version=${{ env.TAGVERSION }}
    # The butler action runs in Docker, which only works on Linux runners.
    - name: Install butler
      run: |
        curl -fsSL -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
        7z x butler.zip -obutler
    - name: Publish to itch.io
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
      run: |
        TARGET=${{ env.ITCH_USER_NAME }}/${{ env.ITCH_GAME_NAME }}
        butler/butler push artifacts/windows $TARGET:windows --userversion ${{ env.TAGVERSION }}
        butler/butler push artifacts/osx $TARGET:osx --userversion ${{ env.TAGVERSION }}
        butler/butler push artifacts/linux $TARGET:linux --userversion ${{ env.TAGVERSION }}
        # itch.io marks a build playable in the browser when the channel name says html, and it
        # serves the index.html sitting at the root of the package, so what goes up is the
        # contents of wwwroot and nothing above it.
        butler/butler push artifacts/web/wwwroot $TARGET:html5 --userversion ${{ env.TAGVERSION }}
